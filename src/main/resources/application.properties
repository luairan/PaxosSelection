# Unique numeric ID per node. Keep it and data-dir stable across restarts.
paxos.node-id=1
paxos.data-dir=./data
# Fixed membership, including this node. Every node must use the same list.
paxos.peers=ws://localhost:8080/paxos

# No built-in credentials. Generate separate random secrets before starting.
paxos.security.node-token=${PAXOS_NODE_TOKEN:}
paxos.security.admin-token=${PAXOS_ADMIN_TOKEN:}
# Local demo is loopback-only; remote deployments must configure HTTPS/WSS.
server.address=127.0.0.1
